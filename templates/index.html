<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f9ff">
  <title>Rule-Based Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="/" aria-label="Rule-Based Chatbot home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>Rule-Based Chatbot</span>
      </a>
      <button class="clear-button" id="clear-chat" type="button" title="Clear conversation">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
          <path d="M3.5 5.5h13M8 5.5V3.8h4v1.7m-6.7 0 .7 10.2h8l.7-10.2M8.2 8.2v4.8m3.6-4.8v4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Clear chat</span>
      </button>
    </header>

    <section class="chat-panel" aria-label="Chat with the rule-based assistant">
      <div class="chat-heading">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Here to help</span>
      </div>
      <div class="chat-messages" id="chat-messages" aria-live="polite" aria-relevant="additions">
        <div class="welcome-block" id="welcome-block">
          <div class="welcome-icon" aria-hidden="true">✳</div>
          <h1>Hello! How can I help you today?</h1>
          <p>Choose a question covered by the chatbot's built-in rules.</p>
          <div class="suggestions" aria-label="Suggested questions">
            <button class="suggestion" type="button" data-question="How are you?">How are you?</button>
            <button class="suggestion" type="button" data-question="What is Python?">What is Python?</button>
            <button class="suggestion" type="button" data-question="What is artificial intelligence?">What is artificial intelligence?</button>
          </div>
        </div>
      </div>

      <form class="composer" id="chat-form">
        <label class="visually-hidden" for="message-input">Your message</label>
        <textarea id="message-input" name="message" rows="1" maxlength="4000" placeholder="Type a question..." required></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="Send message" title="Send message">
          <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
            <path d="M3.2 9.8 16.8 3.5l-4.9 13-2.2-5.3-6.5-1.4Zm6.5 1.4 4.2-4.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="disclaimer">This chatbot uses predefined rules and may not recognize every question.</p>
    </section>
  </main>
</body>
</html>
